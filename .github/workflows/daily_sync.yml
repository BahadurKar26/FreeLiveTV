name: Daily Content Sync

on:
  schedule:
    - cron: '0 0 * * *'  # Run at midnight every day
  workflow_dispatch:      # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp urllib3 certifi

      - name: Run Aggregator
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/channel_aggregator.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add app/src/main/assets/curated_channels.json
          git add app/src/main/assets/movies.json
          git add app/src/main/assets/series.json
          # Final Absolute Resolver: Fail-safe commit logic
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily content sync [skip ci]" && git push origin main)
