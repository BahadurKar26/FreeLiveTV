activityCompose = "1.8.2"
lifecycle = "2.7.0"
media3 = "1.3.1"
okhttp = "4.12.0"
coroutines = "1.7.3"
coil = "2.6.0"
gson = "2.10.1"
junit = "4.13.2"
androidxTest = "1.2.1"
espresso = "3.5.1"
navigationCompose = "2.7.7"
leanback = "1.0.0"
tvFoundation = "1.0.0-alpha10"
tvMaterial = "1.0.0"
work = "2.9.0"
room = "2.6.1"
ksp = "1.9.24-1.0.20"
commonsNet = "3.10.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
